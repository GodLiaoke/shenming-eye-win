[package]
name = "phoenix-windows"
version = "1.0.0"
edition = "2024"

[features]
# 能力回服务端：客户端不内嵌解码引擎，只做采集与转发。
server-mode = []

[[bin]]
name = "Shenming-Eye"
path = "src/main.rs"

[dependencies]
codev-obf = { path = "../codev-obf" }
codev-verify = { path = "../codev-verify" }
anyhow = "1"
hex = "0.4"
phoenix-cloud-relay = { path = "../phoenix-cloud-relay" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tao = "0.37"
wry = "0.56"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
    "Win32_Storage_FileSystem",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
