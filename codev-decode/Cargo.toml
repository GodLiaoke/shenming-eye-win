[package]
name = "codev-decode"
version = "0.1.0"
edition = "2024"

# S3：把引擎的解密/解析管线暴露成一个**可供客户端复用**的库。
#
# 为什么需要这个 crate：解码相关的模块原先只声明在 codev-cli 的 main.rs 里
# （二进制独有），codev-mobile（iOS 客户端库）在模块结构上根本够不到它们。
# 这里用 #[path] 直接复用同一批源文件 —— 不复制代码、不改动原文件，
# 保证引擎与客户端跑的是**同一份实现**（这是"逐字段一致"的前提）。
[dependencies]
codev-obf = { path = "../codev-obf" }
chacha20 = "0.9.1"
base64 = "0.22.1"
codev-assets = { path = "../codev-assets" }
codev-capture = { path = "../codev-capture" }
codev-conceal = { path = "../codev-conceal" }
codev-https = { path = "../codev-https" }
codev-protocol = { path = "../codev-protocol" }
codev-proxy = { path = "../codev-proxy" }
codev-session = { path = "../codev-session" }
codev-stream = { path = "../codev-stream", default-features = false }
codev-web = { path = "../codev-web" }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
toml = "0.9.8"
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
