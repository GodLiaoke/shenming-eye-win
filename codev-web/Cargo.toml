[package]
name = "codev-web"
version = "0.1.0"
edition = "2024"
description = "Loopback-only realtime and replay web UI for CodeV coordinates"
license = "Proprietary"
publish = false

[dependencies]
axum = { version = "0.8.6", features = ["ws"] }
base64 = "0.22.1"
chacha20 = "0.9.1"
codev-assets = { path = "../codev-assets" }
codev-https = { path = "../codev-https" }
codev-proxy = { path = "../codev-proxy" }
codev-stream = { path = "../codev-stream", default-features = false }
futures-util = "0.3.31"
include_dir = "0.7.4"
mime_guess = "2.0.5"
qrcode = "0.14.1"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio-tungstenite = "0.29.0"
