[package]
name = "codev-mobile"
version = "0.1.0"
edition = "2024"
description = "In-process CodeV live proxy engine for iOS/iPadOS (no subprocess)"
license = "Proprietary"
publish = false

[lib]
name = "codev_mobile"
crate-type = ["staticlib"]

[dependencies]
codev-obf = { path = "../codev-obf" }
base64 = "0.22.1"
codev-cli = { path = "../codev-cli", default-features = false }
codev-decode = { path = "../codev-decode" }
codev-verify = { path = "../codev-verify" }
codev-proxy = { path = "../codev-proxy" }
rand = "0.9.2"
serde_json = "1.0.149"
sha2 = "0.10"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
tokio-util = "0.7.19"
tun2proxy = { version = "0.8.4", default-features = false }
