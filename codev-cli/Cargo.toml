[package]
name = "codev-cli"
version = "0.1.0"
edition = "2024"
description = "Rust production CLI for CodeV capture, replay, and coordinate visualization"
license = "Proprietary"
publish = false

[[bin]]
name = "codev-net"
path = "src/main.rs"

[lib]
name = "codev_cli"
path = "src/lib.rs"

[features]
default = ["live-capture"]
live-capture = ["codev-stream/live-capture"]

[dependencies]
codev-obf = { path = "../codev-obf" }
codev-capture = { path = "../codev-capture" }
codev-conceal = { path = "../codev-conceal" }
codev-https = { path = "../codev-https" }
codev-proxy = { path = "../codev-proxy" }
codev-session = { path = "../codev-session" }
clap = { version = "4.5.53", features = ["derive"] }
codev-assets = { path = "../codev-assets" }
codev-protocol = { path = "../codev-protocol" }
codev-stream = { path = "../codev-stream", default-features = false }
codev-web = { path = "../codev-web" }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"
