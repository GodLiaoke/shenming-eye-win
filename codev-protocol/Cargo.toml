[package]
name = "codev-protocol"
version = "0.1.0"
edition = "2024"
description = "Bit-exact CodeV 1.24.0 wire protocol primitives"
license = "Proprietary"
publish = false

[lib]
name = "codev_protocol"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.149"
