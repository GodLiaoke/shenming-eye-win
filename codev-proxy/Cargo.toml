[package]
name = "codev-proxy"
version = "0.1.0"
edition = "2024"
description = "Authenticated, allowlisted SOCKS5 TCP/UDP proxy for CodeV capture"
license = "Proprietary"
publish = false

[dependencies]
base64 = "0.22.1"
codev-capture = { path = "../codev-capture" }
codev-conceal = { path = "../codev-conceal" }
fast-socks5 = "1.0.0"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9.8"
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.23.0"
