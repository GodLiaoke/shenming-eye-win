[package]
name = "codev-session"
version = "0.1.0"
edition = "2024"
description = "Redacted session-material broker for CodeV capture sources"
license = "Proprietary"
publish = false

[dependencies]
codev-stream = { path = "../codev-stream", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.149"
