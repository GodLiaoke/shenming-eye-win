[package]
name = "codev-https"
version = "0.1.0"
edition = "2024"
description = "Allowlisted TLS interception, CA management and bounded plaintext capture"
license = "Proprietary"
publish = false

[dependencies]
base64 = "0.22.1"
codev-conceal = { path = "../codev-conceal" }
codev-session = { path = "../codev-session" }
codev-capture = { path = "../codev-capture" }
codev-proxy = { path = "../codev-proxy" }
rcgen = { version = "0.14.8", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.4"
zeroize = "1.8.2"

[dev-dependencies]
tempfile = "3.23.0"
